<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}vMule Admin{% endblock %}</title>
  <style>
    :root { --bg:#10141c; --card:#1b2230; --line:#2c3548; --acc:#7b8fd4; --ok:#3dba7a; --bad:#d45b5b; --txt:#e8edf7; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 Segoe UI, Tahoma, sans-serif; background:var(--bg); color:var(--txt); }
    a { color:var(--acc); }
    header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:#0c1018; border-bottom:1px solid var(--line); }
    header b { color:var(--acc); }
    header nav { margin-left:auto; display:flex; gap:14px; }
    .wrap { max-width:1080px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); padding:20px; }
    input, textarea, select, button { font:14px Segoe UI, sans-serif; }
    input, textarea, select { width:100%; background:#0c1018; color:var(--txt); border:1px solid var(--line); padding:8px; margin:4px 0 12px; }
    textarea { min-height:140px; }
    label { font-size:12px; color:#9aa6c0; }
    button, .btn { background:var(--acc); color:#0c1018; border:0; padding:8px 14px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
    .btn.bad { background:var(--bad); color:#fff; }
    .btn.ok { background:var(--ok); }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; color:#9aa6c0; font-size:12px; padding:8px; border-bottom:1px solid var(--line); }
    td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    .flash { background:#2a3348; border:1px solid var(--acc); padding:8px 12px; margin-bottom:16px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .muted { color:#9aa6c0; font-size:12px; }
    .pill { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a3348; }
    .pill.on { background:#1e3d2c; color:var(--ok); }
  </style>
</head>
<body>
  <header>
    <b>vMule · Update admin</b>
    <span class="muted">publish / edit / delete client releases</span>
    <nav>
      <a href="{{ url_for('index') }}">Releases</a>
      <a href="{{ url_for('new_update') }}">New update</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </header>
  <div class="wrap">
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
