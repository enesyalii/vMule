<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vMule Admin login</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#10141c; color:#e8edf7; font:14px Segoe UI, Tahoma, sans-serif; }
    form { width:320px; background:#1b2230; border:1px solid #2c3548; padding:24px; }
    h1 { margin:0 0 12px; font-size:18px; color:#7b8fd4; }
    input { width:100%; box-sizing:border-box; margin:6px 0 12px; padding:8px; background:#0c1018; color:#e8edf7; border:1px solid #2c3548; }
    button { width:100%; padding:8px; background:#7b8fd4; border:0; font-weight:700; cursor:pointer; }
    .flash { color:#d45b5b; font-size:13px; }
    p { color:#9aa6c0; font-size:12px; }
  </style>
</head>
<body>
  <form method="post">
    <h1>vMule update admin</h1>
    <p>Separate Python panel. Not part of the public website.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <label>Username</label>
    <input name="username" autofocus>
    <label>Password</label>
    <input name="password" type="password">
    <button type="submit">Sign in</button>
    <p>Credentials come from your local environment. They are never displayed here.</p>
  </form>
</body>
</html>
