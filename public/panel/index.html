<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vMuleWeb — Control panel</title>
  <link rel="stylesheet" href="css/panel.css">
  <link rel="icon" href="/website/img/logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div id="login">
    <div class="card">
      <img src="/website/img/logo.svg" alt="vMule">
      <h1>vMuleWeb</h1>
      <p>Remote control for the running vMule client<br>(aMule-style web interface)</p>
      <input id="pw" type="password" placeholder="Web password" autofocus>
      <button id="login-btn">Login</button>
      <p class="err" id="login-err"></p>
      <p class="hint">Password is configured on the server. It is not shown here.</p>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <div class="brand"><img src="/website/img/logo.svg" alt=""> vMuleWeb</div>
      <nav id="nav">
        <button data-tab="transfer" class="on">Transfers</button>
        <button data-tab="shared">Shared</button>
        <button data-tab="search">Search</button>
        <button data-tab="servers">Servers</button>
        <button data-tab="kad">Kad</button>
        <button data-tab="stats">Statistics</button>
        <button data-tab="prefs">Preferences</button>
        <button data-tab="logs">Logs</button>
      </nav>
      <div class="right">
        <a href="/client/">Client</a>
        <a href="/shop.html">Buy server</a>
        <button id="logout">Logout</button>
      </div>
    </header>
    <div class="status" id="head-status"></div>
    <main>
      <section id="tab-transfer" class="tab on">
        <div class="tools">
          <button data-dl="resume">Resume</button>
          <button data-dl="pause">Pause</button>
          <button data-dl="cancel">Cancel</button>
          <input id="ed2k" placeholder="ed2k://|file|...">
          <button id="ed2k-add">Add link</button>
        </div>
        <h3>Downloads</h3>
        <table id="p-down"><thead><tr><th></th><th>File</th><th>Progress</th><th>Speed</th><th>Sources</th><th>Status</th></tr></thead><tbody></tbody></table>
        <h3>Uploads</h3>
        <table id="p-up"><thead><tr><th>User</th><th>File</th><th>Speed</th></tr></thead><tbody></tbody></table>
      </section>
      <section id="tab-shared" class="tab">
        <div class="tools"><button id="reload-shared">Reload shared files</button></div>
        <table id="p-shared"><thead><tr><th>File</th><th>Size</th><th>Priority</th></tr></thead><tbody></tbody></table>
      </section>
      <section id="tab-search" class="tab">
        <div class="tools">
          <input id="q" placeholder="Search">
          <select id="q-net"><option value="kad">Kad</option><option value="local">Local</option><option value="global">Global</option></select>
          <button id="q-go">Search</button>
          <button id="q-dl">Download selected</button>
        </div>
        <table id="p-search"><thead><tr><th></th><th>File</th><th>Size</th><th>Sources</th></tr></thead><tbody></tbody></table>
      </section>
      <section id="tab-servers" class="tab">
        <div class="tools">
          <input id="sip" placeholder="IP"><input id="sport" placeholder="Port" value="4661"><input id="sname" placeholder="Name">
          <button id="sadd">Add</button>
          <button id="sconn">Connect</button>
          <button id="sdel">Remove</button>
        </div>
        <table id="p-servers"><thead><tr><th></th><th>Name</th><th>Address</th><th>Users</th><th>Files</th></tr></thead><tbody></tbody></table>
      </section>
      <section id="tab-kad" class="tab">
        <div class="tools">
          <button id="kad-on">Bootstrap Kad</button>
          <button id="kad-off">Disconnect Kad</button>
        </div>
        <pre id="kad-pre"></pre>
      </section>
      <section id="tab-stats" class="tab">
        <canvas id="cvs" width="720" height="200"></canvas>
        <pre id="stats-pre"></pre>
      </section>
      <section id="tab-prefs" class="tab">
        <label>Nickname <input id="pnick"></label>
        <label>Max UL KB/s <input id="pup" type="number"></label>
        <label>Max DL KB/s <input id="pdown" type="number"></label>
        <label>TCP port <input id="pport" type="number"></label>
        <button id="psave">Save preferences</button>
      </section>
      <section id="tab-logs" class="tab">
        <div class="tools"><button id="log-reset">Reset log</button></div>
        <pre id="logs-pre"></pre>
      </section>
    </main>
    <footer id="foot"></footer>
  </div>
  <script src="js/panel.js"></script>
</body>
</html>
