<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vMule-Project.net - Official vMule Homepage. Downloads, Help, Docu, News...</title>
  <link rel="stylesheet" href="/website/css/site.css">
  <link rel="icon" href="/website/img/logo.svg">
</head>
<body>
<script src="/website/js/chrome.js"></script>
<script>
document.write(vmuleChrome(`
  <h2>Welcome</h2>
  <h3>What is vMule?</h3>
  <p>vMule is a free peer-to-peer file sharing client, allowing you to connect to millions of users to download and share files with them. By using the VMLF and Kademlia Network it supports semi-centralized as well as decentralized searches and operations. The official client stays free of adware and advertising.</p>
  <p>As of today, vMule continues the classic eMule-style client: a mature protocol, a queue and credit system, and a UI that tells you exactly what the network is doing. Optional <a href="shop.html">purchased servers</a> give you a High-ID node or a dedicated VMLF server of your own.</p>

  <div class="feature">
    <div class="ico">★</div>
    <div>
      <h3>Features</h3>
      <p>Completely free. vMule is also completely free of any Adware, Spyware, and so on. Search for files within vMule, either just with one click or with boolean expressions and filters. vMule uses several networks to create one reliable network. (VMLF, Source Exchange, Kad). A queue and credit system helps to ensure that everyone will get the file he wants by promoting those that upload back to the network. A sophisticated UI aims to keep you informed about everything while keeping it as simple as possible. Talk to other users: Whether the built-in IRC client or direct messages to friends — vMule supports chatting. On-the-fly compression, error handling, corruption checking, obfuscation, NAT detection and much more: vMule's matured protocol takes care of everything behind the scenes.</p>
    </div>
  </div>
  <div class="feature">
    <div class="ico">?</div>
    <div>
      <h3>Do you need help?</h3>
      <p>Sometimes vMule can be a bit overwhelming for new users. But worry not! Our community is here to help. Check out our <a href="help.html">support pages</a> which explain all its functions and try to answer the most questions. If you can't find an answer there, you can visit our <a href="forum.html">forum</a> and ask your questions there. Or you use vMule's built-in IRC function to look for advice from other users. However, please don't forget that those are not paid support staff but just users like you who are willing to help in their free time.</p>
    </div>
  </div>
  <p class="muted" style="margin-top:16px">Launch the <a href="/client/">vMule client</a> in your browser to search, download, and share on the VMLF network.</p>
`));
vmuleReady();
</script>
</body>
</html>
