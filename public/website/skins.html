<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vMule-Project.net - Skins</title>
  <link rel="stylesheet" href="/website/css/site.css">
  <link rel="icon" href="/website/img/logo.svg">
</head>
<body>
<script src="/website/js/chrome.js"></script>
<script>
document.write(vmuleChrome(`
  <h2>Skins</h2>
  <p>vMule uses an INI-based skin (like eMuleSkin.ini) for list colors, plus toolbar icon packs. The web control panel uses templates in the same way amuleweb does.</p>
  <table class="std">
    <tr><th>Skin</th><th>Notes</th></tr>
    <tr><td>Default Classic</td><td>Windows classic gray, the look everyone remembers.</td></tr>
    <tr><td>XP Luna</td><td>Blue title bar, olive lists.</td></tr>
    <tr><td>Reloaded Panel</td><td>aMule-style dark header for the remote UI.</td></tr>
  </table>
  <p class="muted">Drop a skin folder into the client’s <code>skins/</code> directory and pick it under Preferences → Display.</p>
`));
vmuleReady();
</script>
</body>
</html>
